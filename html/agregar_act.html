<!DOCTYPE html>
<html>
<head>
	<title>Form Validation</title>
    <link rel="stylesheet" type="text/css" href="./styles_agregar_act.css">
</head>
<body>
    <div class="main-container">
        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>
        <form name="myForm" method="post" enctype="multipart/form-data">
            <label for="Region">Region</label>
            <input name="region" id="region" required>
                <option value="">Seleccione Región</option>
            </select><br>
            <label for="Comuna">Comuna</label>
            <input name="comuna" id="comuna" required>
                <option value="">Seleccione Comuna</option>
            </select><br>

            <label for="sector">Sector</label>
            <input type="text" name="sector" id="sector" maxlength="100" ><br>

            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" minlength="15" maxlength="200" required><br>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" minlength="15" required><br>
            <label for="phone">Numero de Celular</label>
            <input type="tel" name="phone" id="phone" minlength="8" required><br>
            
            <label for="files">Pictures</label>
            <input type="file" name="files" id="files" multiple accept="image/*,.pdf" required><br>

            <label for="select-department">Mejor departamento</label>
            <select name="select-department" id="select-department" required>
                <option value="">Seleccione un departamento</option>
            </select><br>

            <label for="select-course">Mejor ramo</label>
            <select name="select-course" id="select-course" required>
                <option value="">Seleccione un ramo</option>
            </select><br>

            <label for="reason" style="display: none;">Argumentos</label>
            <textarea name="comments" id="comments" rows="4" cols="50" style="display: none;"></textarea><br>
            
            <button id="submit-btn" type="button">Enviar</button>
        </form>
    </div>
    <script src="./js/select.js"></script>
    <script src="./js/validation.js"></script>
</body>
</html>
